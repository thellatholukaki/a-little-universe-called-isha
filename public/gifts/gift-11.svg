<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="plantGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8F5E9" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#C8E6C9" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#C8E6C9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="terracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E07A5F"/>
      <stop offset="50%" stop-color="#B85D43"/>
      <stop offset="100%" stop-color="#7A3622"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes flowerBreeze { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(3deg); } }
    .breeze { transform-origin: 100px 120px; animation: flowerBreeze 3.5s ease-in-out infinite; }
  </style>
  <circle cx="100" cy="100" r="75" fill="url(#plantGlow)" />
  <!-- Flowers and Foliage -->
  <g class="breeze">
    <!-- Stems -->
    <path d="M100 120 Q85 85 75 60" stroke="#4C784E" stroke-width="3" fill="none"/>
    <path d="M100 120 Q100 80 100 50" stroke="#3D633F" stroke-width="3" fill="none"/>
    <path d="M100 120 Q115 85 125 65" stroke="#4C784E" stroke-width="3" fill="none"/>
    <!-- Leaves -->
    <ellipse cx="86" cy="95" rx="10" ry="5" fill="#588157" transform="rotate(-35 86 95)"/>
    <ellipse cx="114" cy="95" rx="10" ry="5" fill="#588157" transform="rotate(35 114 95)"/>
    <!-- Yellow Daisy Left -->
    <g transform="translate(75, 60)">
      <circle cx="0" cy="0" r="7" fill="#F4A261"/>
      <circle cx="-10" cy="0" r="5" fill="#FFF"/>
      <circle cx="10" cy="0" r="5" fill="#FFF"/>
      <circle cx="0" cy="-10" r="5" fill="#FFF"/>
      <circle cx="0" cy="10" r="5" fill="#FFF"/>
      <circle cx="0" cy="0" r="4.5" fill="#E76F51"/>
    </g>
    <!-- Lavender Stalk Center -->
    <g transform="translate(100, 50)">
      <ellipse cx="-4" cy="-5" rx="4" ry="6" fill="#9F8BB7"/>
      <ellipse cx="4" cy="-5" rx="4" ry="6" fill="#B39DDB"/>
      <ellipse cx="-4" cy="-15" rx="3.5" ry="5" fill="#9F8BB7"/>
      <ellipse cx="4" cy="-15" rx="3.5" ry="5" fill="#B39DDB"/>
      <circle cx="0" cy="-24" r="3.5" fill="#D1C4E9"/>
    </g>
    <!-- Pink Blossom Right -->
    <g transform="translate(125, 65)">
      <circle cx="0" cy="0" r="6" fill="#F2A6B3"/>
      <circle cx="-8" cy="-4" r="5" fill="#FFCCD5"/>
      <circle cx="8" cy="-4" r="5" fill="#FFCCD5"/>
      <circle cx="0" cy="8" r="5" fill="#FFCCD5"/>
      <circle cx="0" cy="0" r="3.5" fill="#BA2D44"/>
    </g>
  </g>
  <!-- Terracotta Planter -->
  <polygon points="68,122 132,122 124,175 76,175" fill="url(#terracotta)" stroke="#5E2718" stroke-width="1.5" filter="drop-shadow(0 6px 12px rgba(94,39,24,0.35))"/>
  <rect x="64" y="115" width="72" height="10" rx="3" fill="#E07A5F" stroke="#5E2718" stroke-width="1.5"/>
  <!-- Decorative Floral Band on Pot -->
  <line x1="72" y1="140" x2="128" y2="140" stroke="#FFF" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.65"/>
</svg>