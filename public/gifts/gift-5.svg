<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="trophyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3B0" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#C59B27" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C59B27" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trophyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6"/>
      <stop offset="40%" stop-color="#F3C343"/>
      <stop offset="70%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#7C5D08"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes trophyShine { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes laurelSway { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; } }
    .trophy-group { animation: trophyShine 4s ease-in-out infinite; }
  </style>
  <circle cx="100" cy="95" r="75" fill="url(#trophyGlow)" />
  <g class="trophy-group">
    <!-- Cup handles -->
    <path d="M65 65 C40 65 40 100 70 105" stroke="url(#trophyGold)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M135 65 C160 65 160 100 130 105" stroke="url(#trophyGold)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Cup Body -->
    <path d="M65 50 L135 50 Q135 115 100 120 Q65 115 65 50 Z" fill="url(#trophyGold)" stroke="#FFF" stroke-width="1.2" filter="drop-shadow(0 6px 12px rgba(140,109,21,0.4))"/>
    <!-- Milestone '23' on Cup -->
    <text x="100" y="88" font-family="'Cinzel Decorative', serif, Georgia" font-size="22" font-weight="bold" fill="#3B2606" text-anchor="middle" font-style="italic">23</text>
    <text x="100" y="103" font-family="sans-serif" font-size="8" font-weight="bold" fill="#6B4B10" text-anchor="middle" letter-spacing="2">YEARS</text>
    <!-- Stem -->
    <rect x="94" y="120" width="12" height="24" fill="url(#trophyGold)"/>
    <ellipse cx="100" cy="144" rx="18" ry="6" fill="url(#trophyGold)"/>
    <!-- Marble Pedestal Base -->
    <rect x="70" y="148" width="60" height="22" rx="4" fill="#252641" stroke="#C59B27" stroke-width="1.5"/>
    <rect x="76" y="153" width="48" height="12" rx="2" fill="#3D3E66"/>
    <!-- Plaque text -->
    <text x="100" y="162" font-family="sans-serif" font-size="6" font-weight="bold" fill="#FFDF80" text-anchor="middle">★ BANGARAM ★</text>
    <!-- Laurels -->
    <path d="M52 80 Q55 55 70 45" stroke="#C59B27" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M148 80 Q145 55 130 45" stroke="#C59B27" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Stars -->
    <circle cx="100" cy="42" r="3.5" fill="#FFE57F"/>
    <circle cx="90" cy="45" r="2" fill="#FFE57F"/>
    <circle cx="110" cy="45" r="2" fill="#FFE57F"/>
  </g>
</svg>