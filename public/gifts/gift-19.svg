<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="sparkBoxGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3E0" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFAB91" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFAB91" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="festiveBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7043"/>
      <stop offset="60%" stop-color="#D84315"/>
      <stop offset="100%" stop-color="#870000"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes burstFloat1 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes ribbonTwirl { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(15deg); } }
    .burst { animation: burstFloat1 3s ease-in-out infinite; }
    .twirl { transform-origin: 100px 70px; animation: ribbonTwirl 2.5s ease-in-out infinite; }
  </style>
  <circle cx="100" cy="100" r="80" fill="url(#sparkBoxGlow)" />
  <!-- Confetti Streamers & Stars Erupting -->
  <g class="burst">
    <circle cx="70" cy="45" r="4" fill="#FFD54F"/>
    <circle cx="135" cy="40" r="4.5" fill="#4DD0E1"/>
    <circle cx="95" cy="30" r="3.5" fill="#E91E63"/>
    <circle cx="50" cy="70" r="3" fill="#81C784"/>
    <circle cx="155" cy="65" r="4" fill="#BA68C8"/>
    <!-- Streamers -->
    <path class="twirl" d="M90 60 Q80 40 100 25 Q115 15 105 5" stroke="#FFD54F" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path class="twirl" d="M110 60 Q125 45 115 30" stroke="#FF4081" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Box Base -->
  <rect x="58" y="90" width="84" height="65" rx="8" fill="url(#festiveBox)" stroke="#FFCC80" stroke-width="2" filter="drop-shadow(0 8px 16px rgba(135,0,0,0.35))"/>
  <!-- Gold Crossed Ribbon -->
  <rect x="94" y="90" width="12" height="65" fill="#FFD54F"/>
  <!-- Bursting Lid Open -->
  <polygon points="50,90 90,65 145,75 105,92" fill="#FF8A65" stroke="#FFE0B2" stroke-width="1.5"/>
</svg>