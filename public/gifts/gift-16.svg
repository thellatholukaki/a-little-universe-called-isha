<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="cozyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3E0" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#FFE0B2" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFE0B2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="warmKnit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5EBE6"/>
      <stop offset="50%" stop-color="#D5BCA9"/>
      <stop offset="100%" stop-color="#A28069"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes steamDrift { 0% { transform: translateY(0) scaleX(1); opacity: 0; } 50% { opacity: 0.8; } 100% { transform: translateY(-25px) scaleX(1.4); opacity: 0; } }
    .steam { animation: steamDrift 3.5s ease-out infinite; }
  </style>
  <circle cx="100" cy="100" r="75" fill="url(#cozyGlow)" />
  <!-- Steam rising from warm mug -->
  <path class="steam" d="M138 65 Q135 55 140 45" stroke="#BA9171" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Rolled Cashmere Blanket -->
  <g transform="translate(0, 10)">
    <rect x="45" y="85" width="85" height="55" rx="16" fill="url(#warmKnit)" stroke="#8F6A52" stroke-width="2" filter="drop-shadow(0 8px 14px rgba(92,60,38,0.3))"/>
    <!-- Knit texture ribbed lines -->
    <line x1="60" y1="85" x2="60" y2="140" stroke="#8F6A52" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="75" y1="85" x2="75" y2="140" stroke="#8F6A52" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="90" y1="85" x2="90" y2="140" stroke="#8F6A52" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="105" y1="85" x2="105" y2="140" stroke="#8F6A52" stroke-width="1.5" stroke-dasharray="3 3"/>
    <!-- Steaming Ceramic Tea Mug on side -->
    <rect x="125" y="75" width="28" height="34" rx="4" fill="#BA2D44" stroke="#8A1729" stroke-width="1.5"/>
    <path d="M153 82 C162 82 162 96 153 96" stroke="#BA2D44" stroke-width="3" fill="none"/>
    <ellipse cx="139" cy="75" rx="14" ry="4" fill="#D7CCC8"/>
    <!-- Cinnamon Stick -->
    <line x1="145" y1="65" x2="135" y2="82" stroke="#5D4037" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>