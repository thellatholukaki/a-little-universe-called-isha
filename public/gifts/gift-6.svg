<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="moonGlow" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FFFDF5"/>
      <stop offset="75%" stop-color="#E8E2D5"/>
      <stop offset="100%" stop-color="#C2B8A3"/>
    </radialGradient>
    <radialGradient id="moonHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF5" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#D9E2EC" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#1E2952" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="woodStand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C5C36"/>
      <stop offset="50%" stop-color="#5E381A"/>
      <stop offset="100%" stop-color="#3D200E"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes moonBreathe { 0%, 100% { filter: drop-shadow(0 0 15px rgba(255,253,240,0.8)); transform: scale(1); } 50% { filter: drop-shadow(0 0 28px rgba(255,245,210,0.95)); transform: scale(1.02); } }
    .breathing-moon { transform-origin: 100px 90px; animation: moonBreathe 4s ease-in-out infinite; }
  </style>
  <circle cx="100" cy="90" r="80" fill="url(#moonHalo)" />
  <!-- Geometric Wooden Stand Base -->
  <polygon points="65,160 100,125 105,128 75,165" fill="url(#woodStand)"/>
  <polygon points="135,160 100,125 95,128 125,165" fill="url(#woodStand)"/>
  <polygon points="100,130 85,168 115,168" fill="#4A2810"/>
  <!-- The Moon Globe -->
  <g class="breathing-moon">
    <circle cx="100" cy="90" r="48" fill="url(#moonGlow)"/>
    <!-- Lunar Craters & Topography -->
    <ellipse cx="85" cy="75" rx="9" ry="7" fill="#D1C7B4" opacity="0.45"/>
    <ellipse cx="115" cy="95" rx="14" ry="10" fill="#D1C7B4" opacity="0.4"/>
    <ellipse cx="80" cy="110" rx="12" ry="8" fill="#D1C7B4" opacity="0.35"/>
    <ellipse cx="120" cy="70" rx="7" ry="5" fill="#D1C7B4" opacity="0.3"/>
    <ellipse cx="98" cy="62" rx="5" ry="4" fill="#D1C7B4" opacity="0.4"/>
    <circle cx="106" cy="108" r="4" fill="#C2B8A3" opacity="0.5"/>
  </g>
</svg>