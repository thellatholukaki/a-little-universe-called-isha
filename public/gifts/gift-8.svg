<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="compassGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFEACC" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#D6A77A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8C6B4F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brassOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="80%" stop-color="#997D23"/>
      <stop offset="100%" stop-color="#59460E"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes needleOscillate { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(12deg); } }
    .needle { transform-origin: 100px 100px; animation: needleOscillate 4.5s ease-in-out infinite; }
  </style>
  <circle cx="100" cy="100" r="78" fill="url(#compassGlow)" />
  <!-- Brass Outer Ring -->
  <circle cx="100" cy="100" r="56" fill="url(#brassOuter)" stroke="#59460E" stroke-width="2" filter="drop-shadow(0 8px 16px rgba(89,65,46,0.35))"/>
  <!-- Top Loop ring for pocket watch / compass -->
  <ellipse cx="100" cy="40" rx="12" ry="8" fill="none" stroke="url(#brassOuter)" stroke-width="4"/>
  <!-- Parchment Dial Face -->
  <circle cx="100" cy="100" r="46" fill="#FFF9ED" stroke="#8C6B4F" stroke-width="1.5"/>
  <!-- Cardinal Tick Marks -->
  <circle cx="100" cy="100" r="42" fill="none" stroke="#D6C2AF" stroke-width="1" stroke-dasharray="2 6"/>
  <!-- Compass Rose Points -->
  <polygon points="100,60 103,95 100,100 97,95" fill="#BA2D44"/>
  <polygon points="100,140 103,105 100,100 97,105" fill="#3A4D6B"/>
  <polygon points="60,100 95,97 100,100 95,103" fill="#8C6B4F"/>
  <polygon points="140,100 105,97 100,100 105,103" fill="#8C6B4F"/>
  <!-- Cardinal Labels -->
  <text x="100" y="73" font-family="serif" font-size="10" font-weight="bold" fill="#BA2D44" text-anchor="middle">N</text>
  <text x="100" y="133" font-family="serif" font-size="9" font-weight="bold" fill="#3A4D6B" text-anchor="middle">S</text>
  <text x="70" y="103" font-family="serif" font-size="9" font-weight="bold" fill="#8C6B4F" text-anchor="middle">W</text>
  <text x="130" y="103" font-family="serif" font-size="9" font-weight="bold" fill="#8C6B4F" text-anchor="middle">E</text>
  <!-- Animated Magnetic Needle -->
  <g class="needle">
    <polygon points="100,62 105,100 95,100" fill="#E84855" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.3))"/>
    <polygon points="100,138 105,100 95,100" fill="#455A64"/>
    <circle cx="100" cy="100" r="5" fill="#FFE57F" stroke="#59460E" stroke-width="1"/>
  </g>
</svg>