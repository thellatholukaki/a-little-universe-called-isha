<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="grandGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#E91E63" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#B71C1C" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#B71C1C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="royalRuby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="40%" stop-color="#D50000"/>
      <stop offset="80%" stop-color="#880E4F"/>
      <stop offset="100%" stop-color="#4A000E"/>
    </linearGradient>
    <linearGradient id="imperialGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="40%" stop-color="#FFD54F"/>
      <stop offset="80%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#7F6000"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes royalHeartBeat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.08); } 30% { transform: scale(1.02); } 45% { transform: scale(1.1); } }
    @keyframes crownGleam { 0%, 100% { filter: drop-shadow(0 0 10px rgba(255,213,79,0.8)); } 50% { filter: drop-shadow(0 0 22px rgba(255,238,88,1)); } }
    .heart-beat { transform-origin: 100px 115px; animation: royalHeartBeat 2.2s ease-in-out infinite; }
    .crown { animation: crownGleam 2.5s ease-in-out infinite; }
  </style>
  <circle cx="100" cy="100" r="85" fill="url(#grandGlow)" />
  <!-- Radiant Starlight Rays -->
  <g stroke="#FFE082" stroke-width="1.5" opacity="0.6">
    <line x1="100" y1="20" x2="100" y2="40"/>
    <line x1="100" y1="165" x2="100" y2="185"/>
    <line x1="20" y1="100" x2="40" y2="100"/>
    <line x1="160" y1="100" x2="180" y2="100"/>
    <line x1="45" y1="45" x2="60" y2="60"/>
    <line x1="140" y1="140" x2="155" y2="155"/>
    <line x1="45" y1="155" x2="60" y2="140"/>
    <line x1="140" y1="60" x2="155" y2="45"/>
  </g>
  <!-- Pulsing Royal Heart -->
  <g class="heart-beat">
    <path d="M100 82 C100 55, 60 55, 60 85 C60 115, 100 148, 100 152 C100 148, 140 115, 140 85 C140 55, 100 55, 100 82 Z" fill="url(#royalRuby)" stroke="#FFF" stroke-width="2" filter="drop-shadow(0 10px 22px rgba(183,28,28,0.55))"/>
    <!-- Milestone '23' Inscribed -->
    <text x="100" y="112" font-family="'Cinzel Decorative', serif, Georgia" font-size="24" font-weight="bold" fill="#FFE57F" text-anchor="middle" font-style="italic">23</text>
    <text x="100" y="125" font-family="sans-serif" font-size="7" font-weight="bold" fill="#FFF" text-anchor="middle" letter-spacing="1">SPECIAL</text>
    <circle cx="80" cy="80" r="4" fill="#FFF" opacity="0.65"/>
  </g>
  <!-- Golden Crown Resting atop the Heart -->
  <g class="crown" transform="translate(0, 5)">
    <path d="M78 68 L82 46 L92 56 L100 40 L108 56 L118 46 L122 68 Z" fill="url(#imperialGold)" stroke="#FFF" stroke-width="1.2"/>
    <rect x="76" y="67" width="48" height="6" rx="2" fill="url(#imperialGold)" stroke="#FFF" stroke-width="0.8"/>
    <!-- Jewels on Crown -->
    <circle cx="82" cy="46" r="3" fill="#E91E63"/>
    <circle cx="100" cy="40" r="4" fill="#00E5FF"/>
    <circle cx="118" cy="46" r="3" fill="#E91E63"/>
    <circle cx="100" cy="70" r="2.5" fill="#E91E63"/>
  </g>
</svg>