<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="mirrorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EBF4FF" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#C5D3E8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C5D3E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mirrorGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F8FF"/>
      <stop offset="50%" stop-color="#D9EBFA"/>
      <stop offset="100%" stop-color="#B0D0E8"/>
    </linearGradient>
    <linearGradient id="giltGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A5"/>
      <stop offset="40%" stop-color="#E5B942"/>
      <stop offset="80%" stop-color="#B2821A"/>
      <stop offset="100%" stop-color="#6E4D07"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes sheenSweep { 0% { transform: translateX(-60px) rotate(25deg); opacity: 0; } 50% { opacity: 0.7; } 100% { transform: translateX(80px) rotate(25deg); opacity: 0; } }
    .sheen { animation: sheenSweep 4s ease-in-out infinite; }
  </style>
  <circle cx="100" cy="95" r="75" fill="url(#mirrorGlow)" />
  <!-- Handle -->
  <path d="M100 135 L100 180 Q100 188 95 188 Q90 188 95 180 L96 135" fill="url(#giltGold)" stroke="#6E4D07" stroke-width="1.5"/>
  <circle cx="97" cy="186" r="6" fill="url(#giltGold)"/>
  <!-- Ornate Outer Frame -->
  <ellipse cx="100" cy="85" rx="52" ry="62" fill="url(#giltGold)" stroke="#6E4D07" stroke-width="2" filter="drop-shadow(0 8px 16px rgba(110,77,7,0.35))"/>
  <!-- Carved Crest Top -->
  <path d="M100 18 C92 10, 85 24, 100 28 C115 24, 108 10, 100 18 Z" fill="url(#giltGold)"/>
  <!-- Mirror Reflective Glass -->
  <ellipse cx="100" cy="85" rx="40" ry="50" fill="url(#mirrorGlass)" stroke="#FFF" stroke-width="1.5"/>
  <!-- Glistening Sheen bar -->
  <g clip-path="url(#mirrorClip)" opacity="0.6">
    <rect class="sheen" x="80" y="30" width="16" height="120" fill="#FFFFFF"/>
  </g>
  <circle cx="90" cy="65" r="3" fill="#FFF" opacity="0.8"/>
  <circle cx="115" cy="110" r="2" fill="#FFF" opacity="0.6"/>
</svg>