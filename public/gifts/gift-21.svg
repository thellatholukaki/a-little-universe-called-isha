<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="mysticGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EDE7F6" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#7E57C2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#311B92" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="purpleLacquered" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#673AB7"/>
      <stop offset="60%" stop-color="#4527A0"/>
      <stop offset="100%" stop-color="#1A0A4A"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes chestPulse { 0%, 100% { transform: translateY(0); filter: drop-shadow(0 10px 18px rgba(69,39,160,0.4)); } 50% { transform: translateY(-6px); filter: drop-shadow(0 14px 26px rgba(126,87,194,0.7)); } }
    .chest { animation: chestPulse 3.8s ease-in-out infinite; }
  </style>
  <circle cx="100" cy="100" r="80" fill="url(#mysticGlow)" />
  <g class="chest">
    <!-- Chest Base -->
    <rect x="52" y="85" width="96" height="65" rx="8" fill="url(#purpleLacquered)" stroke="#E5B942" stroke-width="2.5"/>
    <!-- Domed Curved Lid -->
    <path d="M48 85 Q100 50 152 85 Z" fill="#5E35B1" stroke="#E5B942" stroke-width="2.5"/>
    <!-- Gold Hardware Corner Brackets -->
    <rect x="52" y="85" width="10" height="65" fill="#E5B942" opacity="0.9"/>
    <rect x="138" y="85" width="10" height="65" fill="#E5B942" opacity="0.9"/>
    <!-- Glowing Magical Keyhole Plate -->
    <circle cx="100" cy="112" r="14" fill="#C59B27" stroke="#FFF" stroke-width="1.2"/>
    <circle cx="100" cy="108" r="4.5" fill="#1A0A4A"/>
    <polygon points="98,110 102,110 103,118 97,118" fill="#1A0A4A"/>
    <!-- Magical Light Beam from Keyhole -->
    <circle cx="100" cy="112" r="4" fill="#E040FB" filter="drop-shadow(0 0 8px #E040FB)"/>
  </g>
</svg>