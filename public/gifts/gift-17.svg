<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="jarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9C4" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#FFD54F" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#1A237E" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1A237E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jarGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="40%" stop-color="#E8EAF6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C5CAE9" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes firefly1 { 0%, 100% { transform: translate(0, 0); opacity: 0.6; } 50% { transform: translate(8px, -12px); opacity: 1; } }
    @keyframes firefly2 { 0%, 100% { transform: translate(0, 0); opacity: 0.9; } 50% { transform: translate(-10px, 8px); opacity: 0.5; } }
    .ff1 { animation: firefly1 3.5s ease-in-out infinite; }
    .ff2 { animation: firefly2 2.8s ease-in-out infinite; }
  </style>
  <circle cx="100" cy="100" r="80" fill="url(#jarGlow)" />
  <!-- Glass Jar Body -->
  <rect x="62" y="65" width="76" height="95" rx="16" fill="url(#jarGlass)" stroke="#C5CAE9" stroke-width="2" filter="drop-shadow(0 8px 18px rgba(255,213,79,0.4))"/>
  <!-- Jar Neck & Cork Lid -->
  <rect x="72" y="55" width="56" height="12" rx="3" fill="#D7CCC8" stroke="#8D6E63" stroke-width="1.5"/>
  <rect x="76" y="47" width="48" height="10" rx="3" fill="#A1887F"/>
  <!-- Twine string around neck -->
  <line x1="72" y1="62" x2="128" y2="62" stroke="#FFD54F" stroke-width="2"/>
  <!-- Glowing Fairy Fireflies inside -->
  <g class="ff1">
    <circle cx="85" cy="90" r="5" fill="#FFFDE7" filter="drop-shadow(0 0 6px #FFEB3B)"/>
    <circle cx="115" cy="130" r="4" fill="#FFFDE7" filter="drop-shadow(0 0 5px #FFEB3B)"/>
  </g>
  <g class="ff2">
    <circle cx="110" cy="85" r="5.5" fill="#FFFDE7" filter="drop-shadow(0 0 7px #FFD54F)"/>
    <circle cx="85" cy="135" r="4" fill="#FFFDE7" filter="drop-shadow(0 0 5px #FFD54F)"/>
    <circle cx="100" cy="110" r="6" fill="#FFFFFF" filter="drop-shadow(0 0 10px #FFF)"/>
  </g>
</svg>