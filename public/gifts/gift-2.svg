<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="chocGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE8D6" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#DDA15E" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#DDA15E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chocBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#583120"/>
      <stop offset="100%" stop-color="#2B1408"/>
    </linearGradient>
    <linearGradient id="truffleDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A2810"/>
      <stop offset="60%" stop-color="#2D1506"/>
      <stop offset="100%" stop-color="#140702"/>
    </linearGradient>
    <linearGradient id="goldDrizzle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="50%" stop-color="#E5A93C"/>
      <stop offset="100%" stop-color="#A67015"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes chocFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes goldGleam { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    .float-box { animation: chocFloat 4s ease-in-out infinite; }
    .gleam { animation: goldGleam 2.2s ease-in-out infinite; }
  </style>
  <circle cx="100" cy="100" r="75" fill="url(#chocGlow)" />
  <g class="float-box" transform="translate(0, 5)">
    <!-- Box Base -->
    <rect x="35" y="55" width="130" height="95" rx="14" fill="url(#chocBox)" stroke="#C49B76" stroke-width="2.5" filter="drop-shadow(0 10px 15px rgba(40,15,5,0.4))"/>
    <rect x="42" y="62" width="116" height="81" rx="8" fill="#1C0B04" stroke="#8C5C36" stroke-width="1.5"/>
    <!-- Grid Compartments (3x2) -->
    <!-- Truffle 1: Dark Ganache swirl -->
    <circle cx="62" cy="82" r="14" fill="url(#truffleDark)" stroke="#8C5C36" stroke-width="1"/>
    <path d="M54 82 Q62 74 70 82 Q62 90 54 82" stroke="url(#goldDrizzle)" stroke-width="2" fill="none"/>
    <!-- Truffle 2: Golden Hazelnut -->
    <rect x="90" y="72" width="20" height="20" rx="6" fill="#42220F" stroke="#E5A93C" stroke-width="1"/>
    <circle cx="100" cy="82" r="4.5" fill="#E5A93C"/>
    <!-- Truffle 3: White Chocolate Berry -->
    <circle cx="138" cy="82" r="14" fill="#F4E8D8" stroke="#D5BCA9" stroke-width="1"/>
    <path d="M130 80 Q138 75 146 80 Q138 86 130 80" stroke="#BA2D44" stroke-width="2" fill="none"/>
    <!-- Truffle 4: Pistachio Praline -->
    <rect x="52" y="110" width="20" height="20" rx="5" fill="#3D200E"/>
    <circle cx="62" cy="120" r="4" fill="#88B04B"/>
    <!-- Truffle 5: Sea Salt Caramel -->
    <circle cx="100" cy="120" r="14" fill="url(#truffleDark)"/>
    <rect x="94" y="117" width="12" height="6" rx="2" fill="#E08E45"/>
    <circle cx="98" cy="119" r="1" fill="#FFF"/>
    <circle cx="103" cy="121" r="1" fill="#FFF"/>
    <!-- Truffle 6: Rose Velvet -->
    <circle cx="138" cy="120" r="14" fill="#751A2B"/>
    <path d="M133 118 Q138 114 143 118 Q140 124 133 118" fill="#F2A6B3"/>
    <!-- Satin Gold Ribbon wrapping around -->
    <rect x="35" y="96" width="130" height="12" fill="url(#goldDrizzle)" opacity="0.9"/>
    <!-- Ribbon Bow -->
    <g transform="translate(100, 102)" class="gleam">
      <ellipse cx="-12" cy="0" rx="12" ry="7" fill="url(#goldDrizzle)" transform="rotate(-15 -12 0)"/>
      <ellipse cx="12" cy="0" rx="12" ry="7" fill="url(#goldDrizzle)" transform="rotate(15 12 0)"/>
      <circle cx="0" cy="0" r="5" fill="#FFF275"/>
    </g>
  </g>
  <!-- Sparkles -->
  <g class="gleam">
    <path d="M30 60 L32 55 L34 60 L39 62 L34 64 L32 69 L30 64 L25 62 Z" fill="#FFDF80"/>
    <path d="M170 70 L171 66 L173 70 L177 71 L173 73 L171 77 L170 73 L166 71 Z" fill="#FFDF80"/>
  </g>
</svg>