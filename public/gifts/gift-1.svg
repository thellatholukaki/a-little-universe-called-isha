<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="roseGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD1DC" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#BA2D44" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#BA2D44" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roseRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E84855"/>
      <stop offset="50%" stop-color="#BA2D44"/>
      <stop offset="100%" stop-color="#6A1020"/>
    </linearGradient>
    <linearGradient id="roseDusty" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2A6B3"/>
      <stop offset="70%" stop-color="#D97585"/>
      <stop offset="100%" stop-color="#9E3B4B"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A5"/>
      <stop offset="50%" stop-color="#E5B942"/>
      <stop offset="100%" stop-color="#B2821A"/>
    </linearGradient>
    <linearGradient id="leafGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7FA87B"/>
      <stop offset="100%" stop-color="#3C5E39"/>
    </linearGradient>
    <filter id="softGlow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <style>
    @keyframes swayRose { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
    @keyframes petalFloat1 { 0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.8; } 50% { transform: translateY(-8px) rotate(10deg); opacity: 1; } }
    @keyframes sparkleGlow { 0%, 100% { opacity: 0.4; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.15); } }
    .sway-group { transform-origin: 100px 170px; animation: swayRose 4.5s ease-in-out infinite; }
    .petal-float { animation: petalFloat1 3s ease-in-out infinite; }
    .sparkle { animation: sparkleGlow 2.5s ease-in-out infinite; }
  </style>
  <circle cx="100" cy="95" r="75" fill="url(#roseGlow1)" />
  <g class="sway-group">
    <!-- Stems -->
    <path d="M100 120 Q95 155 90 185" stroke="#3C5E39" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M100 120 Q105 155 110 185" stroke="#4B6E47" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M100 120 Q100 155 100 188" stroke="#355232" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Leaves -->
    <path d="M92 140 Q75 135 70 148 Q85 152 94 146" fill="url(#leafGreen)"/>
    <path d="M108 142 Q125 138 130 150 Q115 154 106 148" fill="url(#leafGreen)"/>
    <path d="M96 160 Q80 162 76 172 Q90 172 98 165" fill="url(#leafGreen)"/>
    <!-- Roses Back -->
    <g transform="translate(68, 65) scale(0.75)">
      <circle cx="30" cy="30" r="24" fill="url(#roseDusty)"/>
      <path d="M18 24 Q30 12 42 24 Q48 36 30 46 Q12 36 18 24 Z" fill="#BA2D44" opacity="0.6"/>
      <circle cx="30" cy="30" r="14" fill="#801828"/>
      <circle cx="30" cy="30" r="8" fill="#540814"/>
    </g>
    <g transform="translate(98, 60) scale(0.78)">
      <circle cx="30" cy="30" r="24" fill="url(#roseRed)"/>
      <path d="M18 24 Q30 12 42 24 Q48 36 30 46 Q12 36 18 24 Z" fill="#F2A6B3" opacity="0.4"/>
      <circle cx="30" cy="30" r="14" fill="#6A1020"/>
      <circle cx="30" cy="30" r="8" fill="#40050E"/>
    </g>
    <!-- Center Main Rose -->
    <g transform="translate(75, 70)">
      <circle cx="26" cy="26" r="28" fill="url(#roseRed)" filter="url(#softGlow1)"/>
      <!-- Petal layers -->
      <path d="M6 24 C4 10, 22 2, 36 8 C48 14, 52 30, 46 42 C38 52, 16 52, 8 38 C4 32, 6 26, 6 24 Z" fill="#9C1E30"/>
      <path d="M12 22 C14 12, 28 8, 38 14 C46 20, 44 34, 38 40 C30 46, 16 44, 12 34 Z" fill="url(#roseRed)"/>
      <path d="M16 22 C18 16, 28 14, 34 18 C38 22, 38 30, 34 34 C28 38, 20 36, 16 30 Z" fill="#E84855"/>
      <circle cx="26" cy="26" r="8" fill="#6A1020"/>
      <path d="M23 24 Q26 21 29 24 Q28 29 23 27 Z" fill="#FFD1DC"/>
    </g>
    <!-- Side Rose Left -->
    <g transform="translate(50, 85) scale(0.85)">
      <circle cx="25" cy="25" r="22" fill="url(#roseDusty)"/>
      <circle cx="25" cy="25" r="12" fill="#BA2D44"/>
      <circle cx="25" cy="25" r="6" fill="#6A1020"/>
    </g>
    <!-- Side Rose Right -->
    <g transform="translate(105, 88) scale(0.85)">
      <circle cx="25" cy="25" r="22" fill="url(#roseDusty)"/>
      <circle cx="25" cy="25" r="12" fill="#BA2D44"/>
      <circle cx="25" cy="25" r="6" fill="#6A1020"/>
    </g>
    <!-- Gold Ribbon Bow -->
    <g transform="translate(78, 125)">
      <!-- Loops -->
      <ellipse cx="14" cy="12" rx="14" ry="8" fill="url(#goldRibbon)" transform="rotate(-25 14 12)"/>
      <ellipse cx="30" cy="12" rx="14" ry="8" fill="url(#goldRibbon)" transform="rotate(25 30 12)"/>
      <!-- Knot -->
      <circle cx="22" cy="12" r="5" fill="#FFE57F"/>
      <!-- Tails -->
      <path d="M18 16 Q12 30 8 40 Q16 36 20 20" fill="url(#goldRibbon)"/>
      <path d="M26 16 Q32 30 36 40 Q28 36 24 20" fill="url(#goldRibbon)"/>
    </g>
  </g>
  <!-- Floating Petals & Sparkles -->
  <g class="petal-float">
    <path d="M45 65 C40 60, 48 50, 55 56 C58 62, 52 70, 45 65 Z" fill="#BA2D44" opacity="0.85"/>
    <path d="M150 75 C146 70, 154 62, 160 67 C164 73, 156 80, 150 75 Z" fill="#E84855" opacity="0.8"/>
    <path d="M140 135 C136 130, 144 122, 150 126 C153 131, 145 138, 140 135 Z" fill="#F2A6B3" opacity="0.85"/>
  </g>
  <g class="sparkle">
    <path d="M40 90 L42 85 L44 90 L49 92 L44 94 L42 99 L40 94 L35 92 Z" fill="#FFDF80"/>
    <path d="M165 105 L166 101 L168 105 L172 106 L168 108 L166 112 L165 108 L161 106 Z" fill="#FFDF80"/>
  </g>
</svg>