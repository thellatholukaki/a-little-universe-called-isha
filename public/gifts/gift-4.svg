<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="starlightAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF7C2" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#FFD166" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#E59830" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1E2952" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldStarFacetL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="60%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#C59B27"/>
    </linearGradient>
    <linearGradient id="goldStarFacetD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C59B27"/>
      <stop offset="60%" stop-color="#8C6D15"/>
      <stop offset="100%" stop-color="#594309"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes starPulse { 0%, 100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.08) rotate(3deg); } }
    @keyframes raySpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .pulse-star { transform-origin: 100px 100px; animation: starPulse 3.5s ease-in-out infinite; }
    .rays { transform-origin: 100px 100px; animation: raySpin 25s linear infinite; }
  </style>
  <circle cx="100" cy="100" r="85" fill="url(#starlightAura)" />
  <!-- Radiant Light Rays -->
  <g class="rays" opacity="0.35">
    <line x1="100" y1="20" x2="100" y2="180" stroke="#FFDF80" stroke-width="2"/>
    <line x1="20" y1="100" x2="180" y2="100" stroke="#FFDF80" stroke-width="2"/>
    <line x1="45" y1="45" x2="155" y2="155" stroke="#FFDF80" stroke-width="1.5"/>
    <line x1="45" y1="155" x2="155" y2="45" stroke="#FFDF80" stroke-width="1.5"/>
  </g>
  <!-- 3D Beveled Star -->
  <g class="pulse-star" filter="drop-shadow(0 0 18px rgba(255,209,102,0.85))">
    <!-- Star Points (Center: 100, 100) -->
    <!-- Top point -->
    <polygon points="100,100 100,35 115,85" fill="url(#goldStarFacetL)"/>
    <polygon points="100,100 100,35 85,85" fill="url(#goldStarFacetD)"/>
    <!-- Right point -->
    <polygon points="100,100 165,100 120,115" fill="url(#goldStarFacetL)"/>
    <polygon points="100,100 165,100 120,85" fill="url(#goldStarFacetD)"/>
    <!-- Bottom Right point -->
    <polygon points="100,100 142,160 100,125" fill="url(#goldStarFacetL)"/>
    <polygon points="100,100 142,160 135,115" fill="url(#goldStarFacetD)"/>
    <!-- Bottom Left point -->
    <polygon points="100,100 58,160 65,115" fill="url(#goldStarFacetL)"/>
    <polygon points="100,100 58,160 100,125" fill="url(#goldStarFacetD)"/>
    <!-- Left point -->
    <polygon points="100,100 35,100 80,85" fill="url(#goldStarFacetL)"/>
    <polygon points="100,100 35,100 80,115" fill="url(#goldStarFacetD)"/>
    <!-- Center Jewel Glow -->
    <circle cx="100" cy="100" r="7" fill="#FFFFFF" filter="drop-shadow(0 0 6px #FFF)"/>
  </g>
</svg>